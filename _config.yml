title: Pave theme documentation
description: Official documentation for the Pave Shopify theme by Corebia.
url: https://docs.corebia.com
baseurl: ""

# Support contact form. Take the id from the form's share link,
# https://tally.so/r/<id>, and put just the id here — the embed on
# /support/contact/ builds its own URL around it. While this is empty that
# page shows an email address instead, which does NOT satisfy section 21 of
# the Shopify Theme Store requirements. See AUDIT_NOTES.md.
tally_form_id: "5B7VOv"

remote_theme: just-the-docs/just-the-docs@v0.7.0

color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

aux_links:
  Contact support:
    - "/support/contact/"
  Theme Store listing:
    - "https://themes.shopify.com"

aux_links_new_tab: false

footer_content: 'Pave theme &copy; Corebia. Documentation last updated <span class="d-inline-block">{{ site.time | date: "%B %Y" }}</span>.'

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

gh_edit_link: false

callouts_level: quiet
callouts:
  warning:
    title: Warning
    color: red
  important:
    title: Important
    color: yellow
  tip:
    title: Tip
    color: green
  note:
    title: Note
    color: blue

permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - DOCUMENTATION_BUILD_REPORT.md
  - AUDIT_NOTES.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
